[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-server"
version = "0.1.0"
description = "Central Telegram relay server (Phase 1 skeleton)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "click>=8.1",
    "pydantic>=2.5",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
relay-admin = "relay_server.admin_cli:cli"
relay-client = "relay_server.client_cli:cli"

[tool.setuptools.packages.find]
include = ["relay_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
